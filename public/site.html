<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F1EEE6">
  <meta name="description" content="顺场 Shunchang · 婚礼现场执行。一张表，一个码，一次顺延。让今天，按顺序发生。">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>顺场 Shunchang · 让今天，按顺序发生</title>
  <script type="module" src="/__web_preview/static/js/index.js"></script>
  <link rel="stylesheet" href="/__web_preview/static/css/index.css">
  <style>
    html, body { margin: 0; height: 100%; background: #F1EEE6; overflow: hidden; }
    lynx-view { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <lynx-view id="site" url="/main.web.bundle"></lynx-view>
  <script>
    (function () {
      var view = document.getElementById('site');
      function syncWidth() {
        view.setAttribute('global-props', JSON.stringify({ siteWidth: window.innerWidth }));
      }
      syncWidth();
      window.addEventListener('resize', syncWidth);
    })();
  </script>
</body>
</html>
